name: Build iOS Offline Translator IPA (iPhone 16 Plus)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Latest llama.xcframework (Metal GPU)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ios-app/Frameworks /tmp/llama-xcf
          XCF_URL=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=15" \
            | jq -r '[.[].assets[] | select(.name | test("xcframework.*\\.(zip|tar\\.gz|tgz)$"; "i")) | .browser_download_url] | first // empty')

          if [ -z "$XCF_URL" ]; then
            echo "ERROR: Could not find xcframework asset in latest 15 llama.cpp releases"
            exit 1
          fi

          echo "Downloading llama.xcframework from: $XCF_URL"
          if [[ "$XCF_URL" == *.zip ]]; then
            curl -fL "$XCF_URL" -o /tmp/llama-xcf/llama.zip
            unzip -q /tmp/llama-xcf/llama.zip -d /tmp/llama-xcf/extracted
          else
            curl -fL "$XCF_URL" -o /tmp/llama-xcf/llama.tar.gz
            mkdir -p /tmp/llama-xcf/extracted
            tar -xzf /tmp/llama-xcf/llama.tar.gz -C /tmp/llama-xcf/extracted
          fi

          FOUND_XCF=$(find /tmp/llama-xcf/extracted -type d -name "llama.xcframework" | head -n 1)
          if [ -z "$FOUND_XCF" ]; then
            echo "ERROR: llama.xcframework not found in downloaded archive"
            find /tmp/llama-xcf/extracted -maxdepth 3
            exit 1
          fi
          mv "$FOUND_XCF" ios-app/Frameworks/llama.xcframework

          # If llama.xcframework is a static framework, switch embed: true -> false cleanly
          BIN_PATH=$(find ios-app/Frameworks/llama.xcframework -path "*ios-arm64*" -name "llama" -type f | head -n 1)
          if [ -n "$BIN_PATH" ] && file "$BIN_PATH" | grep -q "ar archive"; then
            echo "Detected static llama.xcframework -> setting embed: false"
            sed -i '' 's/embed: true/embed: false/g' ios-app/project.yml
          fi

      - name: Generate Xcode Project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build Unsigned Release App (arm64 iOS)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project PS5Translator.xcodeproj \
            -scheme PS5Translator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package PS5Translator-unsigned.ipa
        working-directory: ios-app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PS5Translator.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: PS5Translator.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PS5Translator-unsigned.ipa Payload
          ls -lh PS5Translator-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5Translator-iOS-IPA
          path: ios-app/PS5Translator-unsigned.ipa
          retention-days: 30
